name: Publish Documents

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.typ'
      - 'docs/summary.md'
      - '.github/workflows/publish-summary.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz | tar xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/

      - name: Compile Typst PDF
        run: typst compile docs/lx-rt-implies-rt-proof.typ docs/lx-rt-implies-rt-proof.pdf

      - name: Prepare pages
        run: |
          mkdir -p _site
          cp docs/lx-rt-implies-rt-proof.pdf _site/lx-rt-implies-rt-proof.pdf
          cat > _site/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head><title>Cellular Automata - Documents</title></head>
          <body>
            <h1>Documents</h1>
            <ul>
              <li><a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/summary.md">Project Guide</a></li>
              <li><a href="lx-rt-implies-rt-proof.pdf">Proof: Lx(L) ∈ CA_RT ⟹ L ∈ CA_RT</a></li>
            </ul>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
